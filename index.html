<!DOCTYPE html>
<html>
<head>
    <title>Happy Birthday Nani 🎉</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: black;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        img {
            max-width: 80%;
            border-radius: 20px;
            box-shadow: 0 0 30px gold;
        }
        h1 {
            margin-top: 20px;
            font-size: 50px;
            animation: glow 1s infinite alternate;
        }
        @keyframes glow {
            from { text-shadow: 0 0 10px yellow; }
            to { text-shadow: 0 0 40px red; }
        }
    </style>
</head>
<body>

<img src="nani.jpg" alt="Birthday Photo">

<h1>🎉 Happy Birthday Nani 🎂</h1>

<audio autoplay loop>
    <source src="birthday.mp3" type="audio/mpeg">
</audio>

</body>
</html>
