<!DOCTYPE html>
<html>
<head>
    <title>Happy Birthday Nani 🎉</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: black;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        img {
            max-width: 80%;
            border-radius: 20px;
            box-shadow: 0 0 30px gold;
        }
        h1 {
            margin-top: 20px;
            font-size: 50px;
        }
    </style>
</head>
<body onclick="playMusic()">

<img src="nani.jpg" alt="Birthday Photo">

<h1>🎉 Happy Birthday Nani 🎂</h1>
<p>(Tap anywhere for music 🎵)</p>

<audio id="song" loop>
    <source src="birthday.mp3" type="audio/mpeg">
</audio>

<script>
function playMusic() {
    document.getElementById("song").play();
}
</script>

</body>
</html>
